backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Produits"
    files:
      - file: "data/products.json"
        label: "Catalogue"
        name: "catalog"
        fields:
          - label: "Produits"
            name: "products"
            widget: list
            summary: "{{fields.name}} — {{fields.price}} FCFA"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int", min: 1, step: 1 }
              - { label: "Nom", name: "name", widget: "string", min: 2, max: 80 }
              - { label: "Catégorie", name: "category", widget: "select", options: ["Vêtements","Chaussures","Sacs","Accessoires"] }
              - { label: "Prix", name: "price", widget: "number", value_type: "int", min: 0, step: 500 }
              - label: "Image principale"
                name: "image"
                widget: "string"
                pattern: ['^(https?://|/images/).+', 'URL ou /images/... obligatoire']
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - label: "Couleurs (conditionnel par catégorie)"
                name: "colors"
                widget: "list"
                required: false
                field:
                  { label: "Couleur", name: "color", widget: "string", min: 1, max: 20 }
              - label: "Tailles"
                name: "sizes"
                widget: "list"
                required: false
                field:
                  { label: "Taille", name: "size", widget: "string", min: 1, max: 8 }
              - label: "Galerie (min 1)"
                name: "images"
                widget: "list"
                required: true
                min: 1
                field:
                  { label: "Image", name: "image", widget: "string", pattern: ['^(https?://|/images/).+', 'URL ou /images/... obligatoire'] }
