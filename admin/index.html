<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin MANDEM SHOP</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
    <script>
      // Validation conditionnelle avant sauvegarde (Decap CMS)
      // Modifie ici les catégories où la couleur est optionnelle :
      const COLOR_OPTIONAL_CATEGORIES = ["Vêtements", "Chaussures", "Sacs", "Accessoires"];

      CMS.registerEventListener({
        name: "preSave",
        handler: ({ entry }) => {
          const data = entry.get("data");
          const products = data && data.get("products");
          if (!products || typeof products.toJS !== "function") return entry;

          const items = products.toJS();
          const errors = [];

          items.forEach((item, idx) => {
            const name = item.name || `Produit #${idx + 1}`;
            const category = (item.category || "").trim();
            const colors = Array.isArray(item.colors) ? item.colors.filter(Boolean) : [];
            const images = Array.isArray(item.images) ? item.images.filter(Boolean) : [];

            if (!COLOR_OPTIONAL_CATEGORIES.includes(category) && colors.length === 0) {
              errors.push(`"${name}": couleur obligatoire pour la catégorie "${category || "Non définie"}".`);
            }
            if (images.length === 0) {
              errors.push(`"${name}": ajoute au moins 1 image dans la galerie.`);
            }
          });

          if (errors.length) {
            throw new Error(errors.join("\n"));
          }

          return entry;
        },
      });
    </script>
  </body>
</html>
