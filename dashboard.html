<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | MANDEM SHOP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #000; color: #fff; }
  </style>
</head>
<body>
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <header class="flex items-center justify-between border border-[#222] p-4 bg-black">
      <div>
        <h1 class="text-2xl font-black">MANDEM SHOP - Dashboard</h1>
        <p class="text-sm text-[#aaa]">Traffic + ventes (analytics interne)</p>
      </div>
      <div class="flex items-center gap-2">
        <select id="rangeSelect" class="bg-black border border-[#333] px-3 py-2 text-sm">
          <option value="7">7 jours</option>
          <option value="30" selected>30 jours</option>
          <option value="90">90 jours</option>
        </select>
        <button id="logoutBtn" class="hidden border border-[#333] px-4 py-2 text-sm hover:bg-white hover:text-black transition">Déconnexion</button>
      </div>
    </header>

    <section id="loginCard" class="max-w-md border border-[#222] p-4 bg-black space-y-3">
      <h2 class="font-bold text-lg">Connexion admin</h2>
      <p class="text-sm text-[#aaa]">Accès réservé.</p>
      <input id="passwordInput" type="password" placeholder="Mot de passe admin" class="w-full bg-black border border-[#333] px-3 py-2" />
      <button id="loginBtn" class="w-full bg-white text-black py-2 font-semibold hover:bg-[#e0e0e0] transition">Se connecter</button>
      <p id="loginMsg" class="text-xs text-[#999]"></p>
    </section>

    <section id="dashboard" class="hidden space-y-6">
      <div class="grid gap-4 sm:grid-cols-3">
        <div class="border border-[#222] p-4 bg-black">
          <p class="text-xs text-[#888]">Visites (période)</p>
          <p id="trafficTotal" class="text-2xl font-bold">0</p>
        </div>
        <div class="border border-[#222] p-4 bg-black">
          <p class="text-xs text-[#888]">Commandes (période)</p>
          <p id="ordersTotal" class="text-2xl font-bold">0</p>
        </div>
        <div class="border border-[#222] p-4 bg-black">
          <p class="text-xs text-[#888]">Chiffre d’affaires (période)</p>
          <p id="revenueTotal" class="text-2xl font-bold">0 FCFA</p>
        </div>
      </div>

      <div class="grid gap-6 lg:grid-cols-2">
        <section class="border border-[#222] p-4 bg-black">
          <h3 class="font-semibold mb-2">Traffic</h3>
          <canvas id="trafficChart" height="220"></canvas>
        </section>
        <section class="border border-[#222] p-4 bg-black">
          <h3 class="font-semibold mb-2">Ventes (commandes)</h3>
          <canvas id="salesChart" height="220"></canvas>
        </section>
      </div>
      <p id="dashMsg" class="text-xs text-[#999]"></p>
    </section>
  </main>

  <script>
    const API_BASE = window.location.origin;
    const ADMIN_TOKEN_KEY = "mandem_admin_token_secure";

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const passwordInput = document.getElementById("passwordInput");
    const loginMsg = document.getElementById("loginMsg");
    const dashMsg = document.getElementById("dashMsg");
    const rangeSelect = document.getElementById("rangeSelect");

    const trafficTotal = document.getElementById("trafficTotal");
    const ordersTotal = document.getElementById("ordersTotal");
    const revenueTotal = document.getElementById("revenueTotal");

    let trafficChart = null;
    let salesChart = null;

    function getToken() {
      return sessionStorage.getItem(ADMIN_TOKEN_KEY) || "";
    }

    function setToken(token) {
      if (!token) {
        sessionStorage.removeItem(ADMIN_TOKEN_KEY);
        return;
      }
      sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        Authorization: `Bearer ${getToken()}`
      };
    }

    function formatFCFA(value) {
      return `${Number(value || 0).toLocaleString("fr-FR")} FCFA`;
    }

    async function verifySession() {
      const token = getToken();
      if (!token) return false;
      const response = await fetch(`${API_BASE}/api/admin/verify`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      return response.ok;
    }

    async function login() {
      const password = passwordInput.value.trim();
      if (!password) {
        loginMsg.textContent = "Mot de passe requis.";
        return;
      }

      loginBtn.disabled = true;
      loginMsg.textContent = "Connexion...";

      try {
        const response = await fetch(`${API_BASE}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Connexion refusée");
        }

        const data = await response.json();
        setToken(data.token || "");
        passwordInput.value = "";
        await openDashboard();
      } catch (error) {
        loginMsg.textContent = error.message;
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function fetchMetrics() {
      const days = Number(rangeSelect.value || 30);
      const response = await fetch(`${API_BASE}/api/admin/metrics?days=${days}`, { headers: authHeaders() });
      if (response.status === 401) throw new Error("Session expirée");
      if (!response.ok) throw new Error("Impossible de charger les métriques");
      return response.json();
    }

    function renderCharts(series) {
      const labels = series.map((d) => d.day.slice(5));
      const trafficData = series.map((d) => d.traffic);
      const ordersData = series.map((d) => d.orders);

      if (trafficChart) trafficChart.destroy();
      if (salesChart) salesChart.destroy();

      const ctxTraffic = document.getElementById("trafficChart");
      trafficChart = new Chart(ctxTraffic, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Visites",
            data: trafficData,
            borderColor: "#e63946",
            backgroundColor: "rgba(230,57,70,0.2)",
            fill: true,
            tension: 0.35
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: "#fff" } } },
          scales: {
            x: { ticks: { color: "#aaa" }, grid: { color: "#222" } },
            y: { ticks: { color: "#aaa" }, grid: { color: "#222" } }
          }
        }
      });

      const ctxSales = document.getElementById("salesChart");
      salesChart = new Chart(ctxSales, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Commandes",
            data: ordersData,
            backgroundColor: "#ffffff",
            borderColor: "#999",
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: "#fff" } } },
          scales: {
            x: { ticks: { color: "#aaa" }, grid: { color: "#222" } },
            y: { ticks: { color: "#aaa" }, grid: { color: "#222" } }
          }
        }
      });
    }

    async function loadDashboard() {
      dashMsg.textContent = "Chargement...";
      const data = await fetchMetrics();
      const trafficSum = data.series.reduce((sum, d) => sum + d.traffic, 0);
      const ordersSum = data.series.reduce((sum, d) => sum + d.orders, 0);
      const revenueSum = data.series.reduce((sum, d) => sum + d.revenue, 0);

      trafficTotal.textContent = trafficSum.toLocaleString("fr-FR");
      ordersTotal.textContent = ordersSum.toLocaleString("fr-FR");
      revenueTotal.textContent = formatFCFA(revenueSum);

      renderCharts(data.series);
      dashMsg.textContent = `Période: ${data.days} jours`;
    }

    async function openDashboard() {
      loginCard.classList.add("hidden");
      dashboard.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      loginMsg.textContent = "";
      await loadDashboard();
    }

    function closeDashboard(message = "") {
      setToken("");
      dashboard.classList.add("hidden");
      logoutBtn.classList.add("hidden");
      loginCard.classList.remove("hidden");
      loginMsg.textContent = message;
    }

    loginBtn.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    logoutBtn.addEventListener("click", () => closeDashboard("Déconnecté."));

    rangeSelect.addEventListener("change", async () => {
      try {
        await loadDashboard();
      } catch (error) {
        dashMsg.textContent = error.message;
      }
    });

    (async function init() {
      const valid = await verifySession();
      if (valid) {
        await openDashboard();
      } else {
        closeDashboard("");
      }
    })();
  </script>
</body>
</html>
