<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | MANDEM SHOP</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#e63946" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #000; color: #fff; }
  </style>
</head>
<body class="min-h-screen">
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
    <header class="flex items-center justify-between border border-[#222] p-4 bg-black">
      <div>
        <h1 class="text-2xl font-black">MANDEM SHOP - Admin</h1>
        <p class="text-sm text-[#aaa]">Gestion produits et commandes (accès protégé)</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="installAppBtn" class="hidden border border-[#333] px-4 py-2 text-sm hover:bg-white hover:text-black transition">Installer l'app</button>
        <button id="logoutBtn" class="hidden border border-[#333] px-4 py-2 text-sm hover:bg-white hover:text-black transition">Déconnexion</button>
      </div>
    </header>

    <section id="loginCard" class="max-w-md border border-[#222] p-4 bg-black space-y-3">
      <h2 class="font-bold text-lg">Connexion admin</h2>
      <p class="text-sm text-[#aaa]">Entrez votre mot de passe administrateur.</p>
      <input id="passwordInput" type="password" placeholder="Mot de passe admin" class="w-full bg-black border border-[#333] px-3 py-2" />
      <button id="loginBtn" class="w-full bg-white text-black py-2 font-semibold hover:bg-[#e0e0e0] transition">Se connecter</button>
      <p id="loginMsg" class="text-xs text-[#999]"></p>
    </section>

    <section id="dashboard" class="hidden space-y-6">
      <div class="grid gap-6 lg:grid-cols-2">
        <section class="border border-[#222] p-4 bg-black space-y-3">
          <h2 class="font-bold text-lg">Produits</h2>
          <div class="flex gap-2">
            <button id="refreshProductsBtn" class="border border-[#333] px-3 py-2 text-sm hover:bg-white hover:text-black transition">Rafraîchir</button>
            <button id="newProductBtn" class="border border-[#333] px-3 py-2 text-sm hover:bg-white hover:text-black transition">Nouveau</button>
          </div>
          <select id="productSelect" class="w-full bg-black border border-[#333] px-3 py-2 text-sm"></select>
          <div class="grid sm:grid-cols-2 gap-2">
            <input id="productId" type="number" placeholder="ID" class="bg-black border border-[#333] px-3 py-2 text-sm" />
            <input id="productPrice" type="number" placeholder="Prix FCFA" class="bg-black border border-[#333] px-3 py-2 text-sm" />
          </div>
          <input id="productName" type="text" placeholder="Nom" class="w-full bg-black border border-[#333] px-3 py-2 text-sm" />
          <input id="productCategory" type="text" placeholder="Catégorie" class="w-full bg-black border border-[#333] px-3 py-2 text-sm" />
          <input id="productImage" type="text" placeholder="Image (URL ou chemin)" class="w-full bg-black border border-[#333] px-3 py-2 text-sm" />
          <input id="productBadge" type="text" placeholder="Badge (Nouveau/Promo)" class="w-full bg-black border border-[#333] px-3 py-2 text-sm" />
          <input id="productColors" type="text" placeholder="Couleurs: #000000,#ffffff" class="w-full bg-black border border-[#333] px-3 py-2 text-sm" />
          <input id="productSizes" type="text" placeholder="Tailles: S,M,L,XL" class="w-full bg-black border border-[#333] px-3 py-2 text-sm" />
          <div class="grid grid-cols-2 gap-2">
            <button id="saveProductBtn" class="bg-white text-black py-2 font-semibold hover:bg-[#e0e0e0] transition">Enregistrer</button>
            <button id="deleteProductBtn" class="border border-[#333] py-2 hover:bg-white hover:text-black transition">Supprimer</button>
          </div>
          <p id="productMsg" class="text-xs text-[#999]"></p>
        </section>

        <section class="border border-[#222] p-4 bg-black space-y-3">
          <h2 class="font-bold text-lg">Dernières commandes</h2>
          <button id="refreshOrdersBtn" class="border border-[#333] px-3 py-2 text-sm hover:bg-white hover:text-black transition">Rafraîchir commandes</button>
          <div id="ordersList" class="space-y-2 max-h-[520px] overflow-y-auto"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.location.origin;
    const ADMIN_TOKEN_KEY = "mandem_admin_token_secure";

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const passwordInput = document.getElementById("passwordInput");
    const loginMsg = document.getElementById("loginMsg");

    const refreshProductsBtn = document.getElementById("refreshProductsBtn");
    const newProductBtn = document.getElementById("newProductBtn");
    const productSelect = document.getElementById("productSelect");
    const saveProductBtn = document.getElementById("saveProductBtn");
    const deleteProductBtn = document.getElementById("deleteProductBtn");
    const productMsg = document.getElementById("productMsg");

    const productId = document.getElementById("productId");
    const productName = document.getElementById("productName");
    const productPrice = document.getElementById("productPrice");
    const productCategory = document.getElementById("productCategory");
    const productImage = document.getElementById("productImage");
    const productBadge = document.getElementById("productBadge");
    const productColors = document.getElementById("productColors");
    const productSizes = document.getElementById("productSizes");

    const refreshOrdersBtn = document.getElementById("refreshOrdersBtn");
    const ordersList = document.getElementById("ordersList");

    let products = [];

    function getToken() {
      return sessionStorage.getItem(ADMIN_TOKEN_KEY) || "";
    }

    function setToken(token) {
      if (!token) {
        sessionStorage.removeItem(ADMIN_TOKEN_KEY);
        return;
      }
      sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        Authorization: `Bearer ${getToken()}`
      };
    }

    function parseCsv(value) {
      return value.split(",").map((x) => x.trim()).filter(Boolean);
    }

    function setProductMessage(msg) {
      productMsg.textContent = msg;
    }

    function formatFCFA(value) {
      return `${Number(value || 0).toLocaleString("fr-FR")} FCFA`;
    }

    function clearProductForm() {
      const nextId = products.length ? Math.max(...products.map((p) => Number(p.id) || 0)) + 1 : 1;
      productId.value = String(nextId);
      productName.value = "";
      productPrice.value = "";
      productCategory.value = "";
      productImage.value = "";
      productBadge.value = "";
      productColors.value = "";
      productSizes.value = "";
    }

    function fillProductForm(product) {
      productId.value = String(product.id || "");
      productName.value = product.name || "";
      productPrice.value = String(product.price || "");
      productCategory.value = product.category || "";
      productImage.value = product.image || "";
      productBadge.value = product.badge || "";
      productColors.value = (product.colors || []).join(", ");
      productSizes.value = (product.sizes || []).join(", ");
    }

    function renderProductSelect() {
      productSelect.innerHTML = [
        '<option value="">-- Nouveau produit --</option>',
        ...products.map((p) => `<option value="${p.id}">${p.id} - ${p.name} (${formatFCFA(p.price)})</option>`)
      ].join("");
    }

    async function fetchAdminProducts() {
      const response = await fetch(`${API_BASE}/api/admin/products`, { headers: authHeaders() });
      if (response.status === 401) throw new Error("Session expirée");
      if (!response.ok) throw new Error("Impossible de charger les produits");
      products = await response.json();
      renderProductSelect();
      clearProductForm();
      setProductMessage("Produits chargés.");
    }

    async function fetchOrders() {
      const response = await fetch(`${API_BASE}/api/admin/orders`, { headers: authHeaders() });
      if (response.status === 401) throw new Error("Session expirée");
      if (!response.ok) throw new Error("Impossible de charger les commandes");
      const orders = await response.json();

      if (!orders.length) {
        ordersList.innerHTML = '<p class="text-sm text-[#999]">Aucune commande.</p>';
        return;
      }

      ordersList.innerHTML = orders.map((order) => `
        <article class="border border-[#222] p-3 text-sm">
          <p class="font-semibold">${order.order_ref}</p>
          <p class="text-[#bbb]">${order.payment_method} - ${order.status}</p>
          <p class="text-[#aaa]">${order.customer_name || "Sans nom"} | ${order.phone || "Sans tel"}</p>
          <p class="text-[#aaa]">${order.customer_address || "Adresse non renseignée"}</p>
          <p class="text-[#ddd] mt-1">Total: ${formatFCFA(order.total)}</p>
          <p class="text-[11px] text-[#777] mt-1">${order.created_at}</p>
        </article>
      `).join("");
    }

    async function saveProduct() {
      const payload = {
        id: Number(productId.value),
        name: productName.value.trim(),
        price: Number(productPrice.value),
        category: productCategory.value.trim(),
        image: productImage.value.trim(),
        badge: productBadge.value.trim(),
        colors: parseCsv(productColors.value),
        sizes: parseCsv(productSizes.value)
      };

      if (!payload.id || !payload.name || !payload.price || !payload.category || !payload.image) {
        setProductMessage("Champs obligatoires: ID, nom, prix, catégorie, image.");
        return;
      }

      const response = await fetch(`${API_BASE}/api/admin/products`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify(payload)
      });

      if (response.status === 401) throw new Error("Session expirée");
      if (!response.ok) {
        const err = await response.text();
        throw new Error(err || "Enregistrement impossible");
      }

      setProductMessage("Produit enregistré.");
      await fetchAdminProducts();
      productSelect.value = String(payload.id);
      const selected = products.find((p) => Number(p.id) === payload.id);
      if (selected) fillProductForm(selected);
    }

    async function deleteProduct() {
      const id = Number(productId.value || productSelect.value);
      if (!id) {
        setProductMessage("Sélectionne un produit à supprimer.");
        return;
      }

      const response = await fetch(`${API_BASE}/api/admin/products/${id}`, {
        method: "DELETE",
        headers: authHeaders()
      });

      if (response.status === 401) throw new Error("Session expirée");
      if (!response.ok) {
        const err = await response.text();
        throw new Error(err || "Suppression impossible");
      }

      setProductMessage(`Produit #${id} supprimé.`);
      await fetchAdminProducts();
    }

    async function verifySession() {
      const token = getToken();
      if (!token) return false;
      const response = await fetch(`${API_BASE}/api/admin/verify`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      return response.ok;
    }

    async function login() {
      const password = passwordInput.value.trim();
      if (!password) {
        loginMsg.textContent = "Mot de passe requis.";
        return;
      }

      loginBtn.disabled = true;
      loginMsg.textContent = "Connexion...";

      try {
        const response = await fetch(`${API_BASE}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "Connexion refusée");
        }

        const data = await response.json();
        setToken(data.token || "");
        passwordInput.value = "";
        await openDashboard();
      } catch (error) {
        loginMsg.textContent = error.message;
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function openDashboard() {
      loginCard.classList.add("hidden");
      dashboard.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");
      loginMsg.textContent = "";
      await Promise.all([fetchAdminProducts(), fetchOrders()]);
    }

    function closeDashboard(message = "") {
      setToken("");
      dashboard.classList.add("hidden");
      logoutBtn.classList.add("hidden");
      loginCard.classList.remove("hidden");
      loginMsg.textContent = message;
      products = [];
      renderProductSelect();
      clearProductForm();
      ordersList.innerHTML = "";
    }

    loginBtn.addEventListener("click", login);
    passwordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    logoutBtn.addEventListener("click", () => closeDashboard("Déconnecté."));

    refreshProductsBtn.addEventListener("click", async () => {
      try {
        await fetchAdminProducts();
      } catch (error) {
        closeDashboard(error.message);
      }
    });

    refreshOrdersBtn.addEventListener("click", async () => {
      try {
        await fetchOrders();
      } catch (error) {
        closeDashboard(error.message);
      }
    });

    newProductBtn.addEventListener("click", () => {
      productSelect.value = "";
      clearProductForm();
      setProductMessage("Nouveau produit.");
    });

    productSelect.addEventListener("change", () => {
      const id = Number(productSelect.value);
      if (!id) {
        clearProductForm();
        return;
      }
      const found = products.find((p) => Number(p.id) === id);
      if (found) fillProductForm(found);
    });

    saveProductBtn.addEventListener("click", async () => {
      try {
        await saveProduct();
      } catch (error) {
        setProductMessage(error.message);
        if (error.message.toLowerCase().includes("session")) closeDashboard(error.message);
      }
    });

    deleteProductBtn.addEventListener("click", async () => {
      try {
        await deleteProduct();
      } catch (error) {
        setProductMessage(error.message);
        if (error.message.toLowerCase().includes("session")) closeDashboard(error.message);
      }
    });

    (async function init() {
      renderProductSelect();
      const valid = await verifySession();
      if (valid) {
        await openDashboard();
      } else {
        closeDashboard("");
      }
    })();
  </script>
  <script>
    // Bouton d'installation PWA (Android Chrome / navigateurs compatibles)
    const installBtn = document.getElementById("installAppBtn");
    window.deferredInstallPrompt = null;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      window.deferredInstallPrompt = event;
      installBtn.classList.remove("hidden");
    });

    installBtn.addEventListener("click", async () => {
      if (!window.deferredInstallPrompt) return;
      window.deferredInstallPrompt.prompt();
      try {
        await window.deferredInstallPrompt.userChoice;
      } finally {
        window.deferredInstallPrompt = null;
        installBtn.classList.add("hidden");
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js", { scope: "/" })
          .then((registration) => {
            console.log("Service Worker actif:", registration.scope);
          })
          .catch((error) => {
            console.log("Echec Service Worker:", error);
          });
      });
    }
  </script>
</body>
</html>
